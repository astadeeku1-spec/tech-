<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tech Trends</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="splash-screen">
    <div class="splash-content">
      <h1><span style="filter: drop-shadow(0 0 10px #ff4d4d);"></span>🚀</span>TECH TRENDS <span
          style="filter: drop-shadow(0 0 10px #38bdf8);">📰</span></h1>
    </div>
  </div>

  <header>
    <nav>
      <h2>TECH TRENDS</h2>
      <div class="nav-links">
        <a href="https://astadeeku1-spec.github.io/tech-/" class="btn-live" target="_blank">
          <span>Live Site</span>
          <span>🌐</span>
        </a>
        <button class="theme-toggle" onclick="toggleDark()" id="themeBtn">🌙</button>
      </div>
    </nav>
  </header>

  <main>
    <section id="home">
      <p id="dateTime"></p>
    </section>

    <section>
      <div id="newsContainer" class="news-grid">
        <div class="loader">Curating the future...</div>
      </div>
    </section>

    <section id="feedback-space">
      <div id="feedback">
        <div class="feedback-header">
          <h2>Shape the Future</h2>
          <p>Your feedback helps us curate a better tomorrow. Share your thoughts on the latest tech trends.</p>
        </div>
        <form class="feedback-form" id="feedbackForm">
          <div class="input-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
          </div>
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" required>
          </div>
          <div class="input-group">
            <label for="message">Feedback</label>
            <textarea id="message" rows="5" placeholder="What's on your mind?" required></textarea>
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">
            <span>Deploy Feedback</span>
            <span>🚀</span>
          </button>
          <div id="statusMsg" class="status-msg"></div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 <a href="https://astadeeku1-spec.github.io/tech-/"
        style="color: inherit; text-decoration: none; font-weight: 700;">Daily Tech Trends</a> | Engineered by <a
        href="https://github.com/astadeeku1-spec" style="color: var(--accent-color); text-decoration: none;"
        target="_blank">@astadeeku1-spec</a></p>
  </footer>

  <script src="script.js"></script>

</body>

</html>
